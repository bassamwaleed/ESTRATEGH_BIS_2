<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك  تصميم برامج الحاسب الالي </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            margin-top: 50px;
            margin-bottom: 50px;
            display: none; /* مخفية في البداية */
        }

        .selection-card {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 { color: #4a4a4a; margin-bottom: 25px; }

        .btn-large {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-large:hover { background: #764ba2; transform: translateY(-2px); }
        .btn-large.secondary { background: #4a5568; }
        .btn-large.secondary:hover { background: #2d3748; }

        /* === زر الترس (الإعدادات) أعلى اليمين === */
        .settings-toggle-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            transition: all 0.3s ease;
        }

        .settings-toggle-btn:hover { background: #764ba2; color: white; transform: rotate(90deg); }

        /* === عداد الإجابات المباشر === */
        .live-counter {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 10px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
        }
        .counter-item { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1em; }
        .count-correct { color: #28a745; }
        .count-wrong { color: #dc3545; }

        .controls-container {
            display: none;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #764ba2;
            flex-direction: column;
            gap: 12px;
        }

        .control-row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
        .num-input { padding: 8px; border-radius: 10px; border: 1px solid #ddd; width: 55px; text-align: center; font-weight: bold; }
        .top-btn { background: white; color: #555; border: 1px solid #ddd; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 0.85em; transition: all 0.3s ease; }
        .top-btn:hover { background: #e2e6ea; }
        .top-btn.active { background: #764ba2; color: white; border-color: #764ba2; }
        .start-btn { background: #667eea; color: white; border: none; font-weight: bold; padding: 10px; width: 100%; font-size: 1.1em; }

        .question-number { background: #764ba2; color: white; padding: 5px 18px; border-radius: 50px; font-size: 0.9em; margin-bottom: 20px; display: inline-block; }
        .question { font-size: 1.35em; margin-bottom: 30px; color: #2c3e50; font-weight: bold; line-height: 1.5; text-align: center; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            padding: 18px; border: 2px solid #e0e0e0; background: white; border-radius: 12px; cursor: pointer; font-size: 1.1em; font-family: 'Tajawal', sans-serif; transition: all 0.2s ease; color: #555; text-align: right;
        }
        .option-btn:hover:not(:disabled) { background: #f8f9fa; border-color: #764ba2; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold;}
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        /* تنسيق أزرار صح وخطأ لتكون بجانب بعضها */
        .tf-options { display: flex; flex-direction: row; justify-content: center; gap: 15px; }
        .tf-options .option-btn { flex: 1; text-align: center; padding: 20px; font-size: 1.3em; font-weight: bold; }

        .back-btn { display: inline-block; margin-top: 25px; color: #888; text-decoration: none; font-size: 0.9em; transition: color 0.3s; }
        .back-btn:hover { color: #764ba2; }

        .mistakes-container { text-align: right; max-height: 350px; overflow-y: auto; margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; border: 1px solid #eee; }
        .mistake-item { background: white; padding: 15px; margin-bottom: 12px; border-radius: 8px; border-right: 4px solid #dc3545; }
        .mistake-q { font-weight: bold; margin-bottom: 8px; color: #333; }
        .mistake-wrong { color: #dc3545; font-size: 0.95em; }
        .mistake-correct { color: #28a745; font-size: 0.95em; font-weight: bold; }

        .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s ease; }
    </style>
</head>
<body>

    <!-- شاشة اختيار نوع الأسئلة -->

        <div class="controls-container" id="controls-panel">

                <button id="shuffle-btn" class="top-btn" onclick="toggleShuffle()"><span>🔢</span> الترتيب: عادي</button>
                <button id="show-num-btn" class="top-btn active" onclick="toggleShowNumbers()"><span>🆔</span> رقم السؤال: ظاهر</button>

            <div class="control-row">
                <span class="control-label">من:</span> <input type="number" id="q-start" class="num-input" min="1" value="1">

            </div>
            <div class="control-row">
                <button onclick="applySettings()" class="start-btn">تطبيق وإعادة البدء</button>

        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

        <div id="quiz-container">

        <a href="#" class="back-btn" onclick="returnToSelection()">← العودة لاختيار نوع الأسئلة</a>

        let currentMode = 'mcq'; // 'mcq' or 'tf'
        let originalQuestions = [];
        let questions = [];
        let currentQuestion = 0;
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let isRandom = false; 
        let showNumbers = true; 
        let wrongAnswers = []; 

        function startQuizType(type) {
            currentMode = type;
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            originalQuestions = (type === 'mcq') ? [...mcqQuestions] : [...tfQuestions];
            
            // تعيين الأرقام التعريفية
            originalQuestions.forEach((q, index) => { q.id = index + 1; });
            
            document.getElementById('q-start').max = originalQuestions.length;
            document.getElementById('q-end').max = originalQuestions.length;
            document.getElementById('q-end').value = originalQuestions.length;
            document.getElementById('total-available').innerText = originalQuestions.length;
            
            applySettings();
        }

        function returnToSelection() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('selection-screen').style.display = 'block';
            document.getElementById('controls-panel').style.display = 'none';
        }

        function toggleSettingsPanel() {
            const p = document.getElementById('controls-panel');
            p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
        }

        function toggleShuffle() {
            isRandom = !isRandom;
            const btn = document.getElementById('shuffle-btn');
            if (isRandom) {
                btn.innerHTML = "<span>🔀</span> الترتيب: عشوائي"; btn.classList.add('active');
            } else {
                btn.innerHTML = "<span>🔢</span> الترتيب: عادي"; btn.classList.remove('active');
            }
        }

        function toggleShowNumbers() {
            showNumbers = !showNumbers;
            const btn = document.getElementById('show-num-btn');
            if (showNumbers) {
                btn.innerHTML = "<span>🆔</span> رقم السؤال: ظاهر"; btn.classList.add('active');
            } else {
                btn.innerHTML = "<span>🆔</span> رقم السؤال: مخفي"; btn.classList.remove('active');
            }
            if (questions.length > 0 && currentQuestion < questions.length) updateQuestionDisplay();
        }

        function applySettings() {
            let start = parseInt(document.getElementById('q-start').value);
            let end = parseInt(document.getElementById('q-end').value);
            if (isNaN(start) || start < 1) start = 1;
            if (isNaN(end) || end > originalQuestions.length) end = originalQuestions.length;
            if (start > end) start = end;

            document.getElementById('q-start').value = start;
            document.getElementById('q-end').value = end;

            let selectedQuestions = originalQuestions.slice(start - 1, end);
            if (isRandom) {
                for (let i = selectedQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [selectedQuestions[i], selectedQuestions[j]] = [selectedQuestions[j], selectedQuestions[i]];
                }
            }

            questions = selectedQuestions;
            document.getElementById('q-total').innerText = questions.length;
            document.getElementById('controls-panel').style.display = 'none';
            restartQuiz();
        }

        function restartQuiz() {
            currentQuestion = 0; score = 0; correctCount = 0; wrongCount = 0; wrongAnswers = []; 
            document.getElementById('correct-count').innerText = "0";
            document.getElementById('wrong-count').innerText = "0";

            if (questions.length === 0) return;

            document.getElementById('quiz-container').innerHTML = `
                <div class="question" id="question-text">جاري التحميل...</div>
                <div class="options" id="options-container"></div>
            `;
            loadQuestion();
        }

        function updateQuestionDisplay() {
            const q = questions[currentQuestion];
            const qTextElement = document.getElementById('question-text');
            qTextElement.innerText = showNumbers ? (q.id + ". " + q.t) : q.t;
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) return showFinalResult();

            updateQuestionDisplay();
            document.getElementById('q-curr').innerText = currentQuestion + 1;
            
            const progress = (currentQuestion / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            // تعديل شكل الأزرار بناءً على نوع الاختبار
            if(currentMode === 'tf') {
                container.className = 'options tf-options';
                const icons = ['✅', '❌'];
                questions[currentQuestion].o.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span>${icons[index]} ${opt}</span>`;
                    btn.onclick = () => checkAnswer(index, btn);
                    container.appendChild(btn);
                });
            } else {
                container.className = 'options';
                const letters = ['أ', 'ب', 'ج', 'د'];
                questions[currentQuestion].o.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span>${letters[index]} - </span><span>${opt}</span>`;
                    btn.onclick = () => checkAnswer(index, btn);
                    container.appendChild(btn);
                });
            }
        }

        function checkAnswer(selectedIndex, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            const correctIndex = questions[currentQuestion].a;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++; correctCount++;
                document.getElementById('correct-count').innerText = correctCount;
            } else {
                btnElement.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
                wrongCount++;
                document.getElementById('wrong-count').innerText = wrongCount;
                wrongAnswers.push({
                    q: questions[currentQuestion].t,
                    selected: questions[currentQuestion].o[selectedIndex],
                    correct: questions[currentQuestion].o[correctIndex],
                    qNum: questions[currentQuestion].id 
                });
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) loadQuestion();
                else showFinalResult();
            }, 1000);
        }

        function showFinalResult() {
            document.getElementById('progress-fill').style.width = '100%';
            let resultHTML = `
                <h3>🎉 انتهى الاختبار!</h3>
                <div class="live-counter" style="margin:20px 0;">
                    <span class="count-correct">✅ صح: ${correctCount}</span>
                    <span class="count-wrong">❌ غلط: ${wrongCount}</span>
                </div>
                <button class="btn-large" onclick="restartQuiz()">إعادة هذا الاختبار</button>
            `;
            if (wrongAnswers.length > 0) {
                resultHTML += `<button class="btn-large secondary" onclick="showMistakes()">عرض الإجابات الخاطئة</button>`;
            }
            document.getElementById('quiz-container').innerHTML = resultHTML;
        }

        function showMistakes() {
            let mistakesHTML = `<h3>ملخص الأخطاء</h3><div class="mistakes-container">`;
            wrongAnswers.forEach(item => {
                mistakesHTML += `
                    <div class="mistake-item">
                        <div class="mistake-q">س${item.qNum}: ${item.q}</div>
                        <div class="mistake-wrong">❌ إجابتك: ${item.selected}</div>
                        <div class="mistake-correct">✅ الصح: ${item.correct}</div>
                    </div>
                `;
            });
            mistakesHTML += `</div><button class="btn-large" style="margin-top: 15px;" onclick="restartQuiz()">إعادة الاختبار</button>`;
            document.getElementById('quiz-container').innerHTML = mistakesHTML;
        }
    </script>
