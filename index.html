<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك أسئلة الفرقة الرابعة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        h1 {
            color: #4a4a4a;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .subjects-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .subject-btn {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .subject-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .subject-btn span {
            font-size: 1.5em;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>📚 بنك أسئلة الفرقة الرابعة</h1>
        
        <div class="subjects-container">
            <a href="accounting.html" class="subject-btn">
                <span>📊</span> مبادئ الاستثمار
            </a>
            <a href="analysis.html" class="subject-btn">
                <span>💰</span> بنك أسئلة التأمين وإدارة  
            </a>
            <a href="emanagement.html" class="subject-btn">
                <span>💻</span>  بنك أسئلة مقرر قواعد البيانات  
            </a>
            <a href="hr.html" class="subject-btn">
                <span>👥</span> بنك اسئلة اقتصاديات الخدمات الحكومية  
            </a>
            <a href="statistics.html" class="subject-btn">
                <span>📈</span> بنك الأسئلة اقتصاد كلى ميد تيرم 
            </a>
            <a href="strategy.html" class="subject-btn">
                <span>🎯</span>  ماده مش تبعكم
            </a>
        </div>
    </div>

</body>
</html>
